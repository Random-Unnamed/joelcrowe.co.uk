media:
  input: images
  output: /images
  categories: [image]

content:
  - name: articles
    label: Articles
    type: file
    path: articles.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Web address name (lowercase, hyphens, e.g. my-first-article)
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: cover
        label: Cover photo
        type: image
      - name: cover_alt
        label: Cover photo description (for screen readers)
        type: string
      - name: summary
        label: Short summary (shown on the home page)
        type: text
      - name: body
        label: Article
        type: rich-text

  - name: site
    label: Site text
    type: file
    path: site.json
    format: json
    fields:
      - { name: site_title, label: Site title, type: string }
      - { name: tagline, label: Tagline, type: string }
      - { name: intro, label: Intro paragraph, type: text }
      - { name: articles_heading, label: Articles heading, type: string }
      - { name: read_more, label: Read more link text, type: string }
      - { name: no_articles, label: Text when there are no articles, type: string }
      - { name: about_heading, label: About heading, type: string }
      - { name: about, label: About text, type: rich-text }
      - { name: author_name, label: Author name, type: string }
      - { name: byline_prefix, label: Byline (before your name), type: string }
      - { name: back_link, label: Back link text, type: string }
      - { name: contact_heading, label: Contact heading, type: string }
      - { name: contact_text, label: Contact text, type: string }
      - { name: contact_email, label: Contact email, type: string }
      - { name: links_heading, label: Links heading, type: string }
      - name: links
        label: Links (shown at the bottom of every page)
        type: object
        list: true
        fields:
          - { name: label, label: Link text (e.g. Apprentice Insider), type: string }
          - { name: url, label: Web address, type: string }
      - { name: credit, label: Credit line (footer), type: text }